<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuizDash Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header class="header">
      <h1>QuizDash</h1>
      <p>Test your knowledge with live trivia</p>
    </header>

    <!-- Screen 1: Home / Setup -->
    <section id="screen-setup" class="view active">
      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="9">General Knowledge</option>
          <option value="17">Science & Nature</option>
          <option value="23">History</option>
          <option value="22">Geography</option>
          <option value="11">Entertainment: Film</option>
          <option value="15">Entertainment: Video Games</option>
        </select>
      </div>

      <div class="form-group">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div class="form-group">
        <label for="num-questions">Number of Questions</label>
        <select id="num-questions">
          <option value="5">5 Questions</option>
          <option value="10" selected>10 Questions</option>
          <option value="15">15 Questions</option>
        </select>
      </div>

      <button id="start-btn" class="btn">START QUIZ</button>
    </section>

    <!-- Loading Screen state -->
    <section id="screen-loading" class="view">
      <div class="loader-container">
        <div class="spinner"></div>
        <p>Fetching questions from server...</p>
      </div>
    </section>

    <!-- Screen 2: Quiz -->
    <section id="screen-quiz" class="view">
      <div class="quiz-meta">
        <p id="question-tracker">Question 1 of 10</p>
        <p class="timer-badge">Timer: <p id="timer-display">00:15</p></p>
      </div>

      <div id="question-text" class="question-box">
        Loading question...
      </div>

      <div id="options-grid" class="options-grid">
        <!-- Options generated dynamically -->
      </div>
    </section>

    <!-- Screen 3: Results -->
    <section id="screen-results" class="view">
      <div class="score-banner">
        <h2 id="score-text">Your Score: 0 / 0 (0%)</h2>
      </div>

      <div class="review-title">Review of Missed Questions</div>
      
      <div id="missed-list" class="missed-list">
        <!-- Missed list items -->
      </div>

      <button id="restart-btn" class="btn">PLAY AGAIN</button>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
